# ==================== 应用基础配置 ====================
spring.application.name=starscreen-ticketing
server.port=8080

# ==================== 数据源配置 (MySQL) ====================
# 数据库连接地址（含字符编码、时区设置）
spring.datasource.url=jdbc:mysql://localhost:3306/starscreen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# 数据库用户名（仅有 SELECT/INSERT/UPDATE/DELETE 权限，不具备建表权限）
spring.datasource.username=starscreen_app
# 数据库密码：优先读取环境变量 DB_PASSWORD，未设置时使用默认值
# 生产环境必须通过环境变量注入，不要依赖这里的默认值
spring.datasource.password=${DB_PASSWORD:Abc@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / Hibernate 配置 ====================
# 【重要】表结构由 src/main/resources/schema.sql 唯一负责，不交给 Hibernate 生成。
#   none    —— 不自动建表/改表（当前选择）
#   validate—— 只校验、不改动（可选加固，见 README「结构自检」）。
#              注意：启用前需先逐列对齐实体 @Column(length) 与 DDL 长度，
#              否则会因 release_date 期望 255 / 实际 20 这类差异导致启动失败。
#   update  —— 由实体注解反推表结构，会和 schema.sql 产生两个互相打架的 DDL 来源，
#              历史上就是这样把 cinema.phone、t_order 时间类型搞乱的，不要再用。
spring.jpa.hibernate.ddl-auto=none
# 是否在控制台打印 SQL（调试时改为 true）
spring.jpa.show-sql=false

# ==================== SQL 脚本初始化配置 ====================
# 【重要】schema.sql / data.sql 不随应用启动执行，由运维手动执行一次：
#     mysql -u root -p --default-character-set=utf8mb4 < src/main/resources/schema.sql
#     mysql -u root -p --default-character-set=utf8mb4 < src/main/resources/data.sql
# 原因：应用账号 starscreen_app 只被授予 DML 权限，没有 CREATE/ALTER/DROP，
#       即使把这里改成 always，启动时也会因 "CREATE command denied" 直接失败。
#       把 DDL 权限收归 DBA，是防止注入/误操作改结构的最后一道防线。
spring.sql.init.mode=never
# 若确实需要在本地开发库上自动初始化，新建 application-dev.properties 并设置：
#     spring.sql.init.mode=always
#     spring.sql.init.encoding=utf-8
#     spring.sql.init.continue-on-error=false
# 注意：schema.sql 与 data.sql 均已做幂等处理，重复执行不会报错或产生重复数据。

# ==================== Thymeleaf 模板配置 ====================
# 关闭模板缓存，便于开发时实时看到页面修改
spring.thymeleaf.cache=false

# ==================== 日志配置 ====================
logging.level.root=WARN
logging.level.com.starscreen=INFO

# ==================== Redis 配置 ====================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# ==================== RabbitMQ 配置 ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==================== 发码接口返回策略 ====================
# 发送短信验证码时，是否把验证码明文放进 Result.data 返回给前端。
#   false —— 默认（生产/安全基线）：data 恒为 null，前端只提示"验证码已发送"。
#            与 SecurityAndOrderTest#testSmsCodeNotReturned 的断言一致，不要随意改。
#   true  —— 演示/本地联调：data = 6 位验证码，前端弹窗提示并自动填入。
# 需要演示自动填码时，用环境变量临时打开：APP_SMS_RETURN_CODE=true
app.sms.return-code=false

# ==================== 环境配置 ====================
# 默认不激活任何 profile；仓库中不存在 application-dev.properties。
# 需要本地覆盖配置时再创建该文件（见上方 SQL 脚本初始化配置）。
# spring.profiles.active=dev

# ==================== 优雅停机 ====================
# 容器编排下 docker stop 会发 SIGTERM：先停止接收新请求，等在途请求（如下单事务）收尾，
# 超过 timeout 再强杀。与 docker-compose.yml 的 stop_grace_period=30s 配合使用。
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ==================== Session / Cookie 配置 ====================
# 限制 Cookie 仅在同站请求中发送，防止 CSRF
server.servlet.session.cookie.same-site=strict

# ==================== 错误页配置 ====================
# 关闭默认的 Whitelabel 错误页（改为自定义错误处理）
server.error.whitelabel.enabled=false
