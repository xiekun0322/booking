spring.application.name=starscreen-ticketing
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/starscreen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=starscreen_app
# export DB_PASSWORD="Abc@1234" \u670D\u52A1\u5668\u73AF\u5883\u914D\u7F6E 
# spring.datasource.password=${DB_PASSWORD}
spring.datasource.password=${DB_PASSWORD:Abc@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update 

spring.thymeleaf.cache=false

logging.level.root=WARN
logging.level.com.starscreen=INFO

# Redis configuration
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# RabbitMQ configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.profiles.active=dev
# \u751F\u4EA7\u73AF\u5883
# spring.profiles.active=prod

server.servlet.session.cookie.same-site=strict

spring.sql.init.mode=always
ddl-auto=none