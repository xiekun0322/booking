# ==================== 应用基础配置 ====================
spring.application.name=starscreen-ticketing
server.port=8080

# ==================== 数据源配置 (MySQL) ====================
# 数据库连接地址（含字符编码、时区设置）
spring.datasource.url=jdbc:mysql://localhost:3306/starscreen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# 数据库用户名（仅有 SELECT/INSERT/UPDATE/DELETE 权限，不具备建表权限）
spring.datasource.username=starscreen_app
# 数据库密码：优先读取环境变量 DB_PASSWORD，未设置时使用默认值
# 生产环境必须通过环境变量注入，不要依赖这里的默认值
spring.datasource.password=${DB_PASSWORD:Abc@1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / Hibernate 配置 ====================
# 【重要】表结构由 src/main/resources/schema.sql 唯一负责，不交给 Hibernate 生成。
#   none    —— 不自动建表/改表（当前选择）
#   validate—— 只校验、不改动（可选加固，见 README「结构自检」）。
#              注意：启用前需先逐列对齐实体 @Column(length) 与 DDL 长度，
#              否则会因 release_date 期望 255 / 实际 20 这类差异导致启动失败。
#   update  —— 由实体注解反推表结构，会和 schema.sql 产生两个互相打架的 DDL 来源，
#              历史上就是这样把 cinema.phone、t_order 时间类型搞乱的，不要再用。
spring.jpa.hibernate.ddl-auto=none
# 是否在控制台打印 SQL（调试时改为 true）
spring.jpa.show-sql=false

# ==================== SQL 脚本初始化配置 ====================
# 【重要】schema.sql / data.sql 不随应用启动执行，由运维手动执行一次：
#     mysql -u root -p --default-character-set=utf8mb4 < src/main/resources/schema.sql
#     mysql -u root -p --default-character-set=utf8mb4 < src/main/resources/data.sql
# 原因：应用账号 starscreen_app 只被授予 DML 权限，没有 CREATE/ALTER/DROP，
#       即使把这里改成 always，启动时也会因 "CREATE command denied" 直接失败。
#       把 DDL 权限收归 DBA，是防止注入/误操作改结构的最后一道防线。
spring.sql.init.mode=never
# 若确实需要在本地开发库上自动初始化，新建 application-dev.properties 并设置：
#     spring.sql.init.mode=always
#     spring.sql.init.encoding=utf-8
#     spring.sql.init.continue-on-error=false
# 注意：schema.sql 与 data.sql 均已做幂等处理，重复执行不会报错或产生重复数据。

# ==================== Thymeleaf 模板配置 ====================
# 关闭模板缓存，便于开发时实时看到页面修改
spring.thymeleaf.cache=false

# ==================== 日志配置 ====================
logging.level.root=WARN
logging.level.com.starscreen=INFO

# ==================== Redis 配置 ====================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# ==================== RabbitMQ 配置 ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==================== 发码接口返回策略 ====================
# 发送短信验证码时，是否把验证码明文放进 Result.data 返回给前端。
#   false —— 默认（生产/安全基线）：data 恒为 null，前端只提示"验证码已发送"。
#            与 SecurityAndOrderTest#testSmsCodeNotReturned 的断言一致，不要随意改。
#   true  —— 演示/本地联调：data = 6 位验证码，前端弹窗提示并自动填入。
# 需要演示自动填码时，用环境变量临时打开：APP_SMS_RETURN_CODE=true
app.sms.return-code=false

# ==================== 环境配置 ====================
# 默认不激活任何 profile；仓库中不存在 application-dev.properties。
# 需要本地覆盖配置时再创建该文件（见上方 SQL 脚本初始化配置）。
# spring.profiles.active=dev

# ==================== 优雅停机 ====================
# 容器编排下 docker stop 会发 SIGTERM：先停止接收新请求，等在途请求（如下单事务）收尾，
# 超过 timeout 再强杀。与 docker-compose.yml 的 stop_grace_period=30s 配合使用。
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ==================== Session / Cookie 配置 ====================
# 限制 Cookie 仅在同站请求中发送，防止 CSRF
server.servlet.session.cookie.same-site=strict

# ==================== 错误页配置 ====================
# 关闭默认的 Whitelabel 错误页（改为自定义错误处理）
server.error.whitelabel.enabled=false

# ==================== 拍卖模块 ====================
# 拍卖是独立数据源（库名 auction）：拍卖是热点写，票务是低频写，混库时一次出价风暴
# 会把选座下单的连接一起拖慢。两个库各自一套 EntityManagerFactory / 事务管理器，
# 见 com.starscreen.config.BusinessDataSourceConfig 与 com.starscreen.auction.config.AuctionDataSourceConfig。
app.auction.datasource.url=jdbc:mysql://localhost:3306/auction?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
app.auction.datasource.username=starscreen_app
app.auction.datasource.password=${DB_PASSWORD:Abc@1234}
app.auction.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 拍卖库连接池开得比业务库小：写入都是短事务（条件 UPDATE），连接多了反而增加锁竞争
app.auction.datasource.hikari.maximum-pool-size=16
app.auction.datasource.hikari.minimum-idle=4
app.auction.datasource.hikari.connection-timeout=3000

# 总开关：关闭后拍卖的定时任务、MQ 消费者、模拟支付接口全部不装配
app.auction.enabled=true
# 开拍扫描 / 关拍扫描单批条数
app.auction.start-batch-size=50
app.auction.settle-batch-size=100
# 单场拍卖最多顺延次数：不设上限时，持续出价可以让一场拍卖永不结束
app.auction.max-extend-times=30
# 存证模式：NONE 只记本地摘要；HTTP 走外部网关（需配 endpoint）
app.auction.chain-mode=NONE
app.auction.chain-endpoint=

# ---- 保证金定价（决策四 C）----
# 金额 = clamp(起拍价 × ratio, min, cap)，在【发布拍品时】算好写进 auction_item.deposit。
# 报名只读该快照，永不重算：改这三个值只影响新发布的拍品，存量拍的应缴/应退金额不变。
app.auction.deposit.ratio=0.05
app.auction.deposit.min=500
app.auction.deposit.cap=50000

# ---- 成交单（决策五 A）----
# 关拍后多少小时内必须付清成交款，超时判悔拍（保证金罚没）。
app.auction.deal.pay-deadline-hours=24
# 悔拍扫描：单批条数 / 间隔（毫秒）。与开拍/关拍扫描分开，避免互相阻塞。
app.auction.deal.overdue-sweep-batch=50
app.auction.deal.overdue-sweep-interval-ms=10000
# 退款：单批条数 / 间隔 / 最大重试 / 退避基数（秒：30、60、120…）
app.auction.deal.refund-sweep-batch=50
app.auction.deal.refund-sweep-interval-ms=15000
app.auction.deal.refund-max-retry=5
app.auction.deal.refund-retry-base-seconds=30

# ---- 发件箱（决策一 C / 二 B）----
# relay 兜底扫描间隔；OutboxWriter 在事务提交后还会走一次快速通道，正常延迟远小于此值。
app.auction.outbox.relay-interval-ms=3000
app.auction.outbox.batch-size=100
# 投递失败最大重试次数，超过转 DEAD（保留 payload 供人工重放）
app.auction.outbox.max-retry=8
# 租约时长（秒）：期内其它实例不碰同一条记录
app.auction.outbox.lease-seconds=30
# SENT 记录保留天数与每批清理条数
app.auction.outbox.sent-retention-days=7
app.auction.outbox.purge-batch=1000

# ---- 模拟支付通道 ----
# 生产必须设为 false：开启时 /api/auction/mock-pay/** 可以把任一支付单直接标成已支付。
# 关掉后整个 MockPayController 不装配，保证金/成交款的正规入口不受影响。
app.auction.mock-pay-enabled=true

# ---- 定时任务线程池 ----
# 默认是单线程：开拍扫描、关拍结算、发件箱 relay、退款、悔拍扫描会排队执行，
# 任何一个任务卡住（例如关拍时同步发 MQ 遇到 broker 不可用），其余任务全部停摆——
# 表现为"拍品不开拍、钱也不退"，但日志里只有一行发送失败。
# 调到 4 让这几类任务互不阻塞；拍卖周期是小时级，4 个线程足够。
spring.task.scheduling.pool.size=4
