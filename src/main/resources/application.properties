# ==================== \u5E94\u7528\u57FA\u7840\u914D\u7F6E ====================
# \u5E94\u7528\u540D\u79F0
spring.application.name=starscreen-ticketing
# \u670D\u52A1\u7AEF\u53E3
server.port=8080

# ==================== \u6570\u636E\u6E90\u914D\u7F6E (MySQL) ====================
# \u6570\u636E\u5E93\u8FDE\u63A5\u5730\u5740\uFF08\u542B\u5B57\u7B26\u7F16\u7801\u3001\u65F6\u533A\u8BBE\u7F6E\uFF09
spring.datasource.url=jdbc:mysql://localhost:3306/starscreen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# \u6570\u636E\u5E93\u7528\u6237\u540D
spring.datasource.username=starscreen_app
# \u6570\u636E\u5E93\u5BC6\u7801\uFF1A\u4F18\u5148\u8BFB\u53D6\u73AF\u5883\u53D8\u91CF DB_PASSWORD\uFF0C\u672A\u8BBE\u7F6E\u65F6\u4F7F\u7528\u9ED8\u8BA4\u503C 
spring.datasource.password=${DB_PASSWORD}
# MySQL 8+ \u9A71\u52A8\u7C7B
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / Hibernate \u914D\u7F6E ====================
# \u6CE8\u610F\uFF1Addl-auto \u91CD\u590D\u914D\u7F6E\uFF0C\u4E0B\u9762\u7684 update \u4F1A\u8986\u76D6\u4E0A\u9762\u7684 create\uFF0C\u5EFA\u8BAE\u4FDD\u7559 update \u5373\u53EF
# spring.jpa.hibernate.ddl-auto=create   # \uFF08\u5DF2\u6CE8\u91CA/\u5220\u9664\uFF0C\u907F\u514D\u6B67\u4E49\uFF09
spring.jpa.hibernate.ddl-auto=update
# \u662F\u5426\u5728\u63A7\u5236\u53F0\u6253\u5370 SQL\uFF08\u5173\u95ED\u4EE5\u51CF\u5C11\u65E5\u5FD7\u566A\u97F3\uFF0C\u8C03\u8BD5\u65F6\u53EF\u6539\u4E3A true\uFF09
spring.jpa.show-sql=false

# ==================== Thymeleaf \u6A21\u677F\u914D\u7F6E ====================
# \u5173\u95ED\u6A21\u677F\u7F13\u5B58\uFF0C\u4FBF\u4E8E\u5F00\u53D1\u65F6\u5B9E\u65F6\u770B\u5230\u9875\u9762\u4FEE\u6539
spring.thymeleaf.cache=false

# ==================== \u65E5\u5FD7\u914D\u7F6E ====================
# \u6839\u65E5\u5FD7\u7EA7\u522B\uFF1A\u4EC5\u8F93\u51FA WARN \u53CA\u4EE5\u4E0A
logging.level.root=WARN
# \u4E1A\u52A1\u5305\u65E5\u5FD7\u7EA7\u522B\uFF1A\u8F93\u51FA INFO \u53CA\u4EE5\u4E0A
logging.level.com.starscreen=INFO

# ==================== Redis \u914D\u7F6E ====================
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.database=0

# ==================== RabbitMQ \u914D\u7F6E ====================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==================== \u73AF\u5883\u914D\u7F6E ====================
# \u5F53\u524D\u6FC0\u6D3B\u7684 profile\uFF1A\u5F00\u53D1\u73AF\u5883
spring.profiles.active=dev
# \u751F\u4EA7\u73AF\u5883\uFF08\u5207\u6362\u65F6\u4F7F\u7528\uFF09
# spring.profiles.active=prod

# ==================== Session / Cookie \u914D\u7F6E ====================
# \u9650\u5236 Cookie \u4EC5\u5728\u540C\u7AD9\u8BF7\u6C42\u4E2D\u53D1\u9001\uFF0C\u9632\u6B62 CSRF
server.servlet.session.cookie.same-site=strict

# ==================== SQL \u521D\u59CB\u5316\u914D\u7F6E ====================
# \u5173\u95ED\u6BCF\u6B21\u542F\u52A8\u81EA\u52A8\u6267\u884C SQL \u811A\u672C
spring.sql.init.mode=never
# \u6CE8\u610F\uFF1Addl-auto \u4E0D\u662F\u6807\u51C6 Spring Boot \u5C5E\u6027\uFF08JPA \u7684\u5E94\u4E3A spring.jpa.hibernate.ddl-auto\uFF09\uFF0C\u6B64\u884C\u53EF\u80FD\u65E0\u6548\uFF0C\u5EFA\u8BAE\u5220\u9664
# ddl-auto=none

# ==================== \u9519\u8BEF\u9875\u914D\u7F6E ====================
# \u5173\u95ED\u9ED8\u8BA4\u7684 Whitelabel \u9519\u8BEF\u9875\uFF08\u6539\u4E3A\u81EA\u5B9A\u4E49\u9519\u8BEF\u5904\u7406\uFF09
server.error.whitelabel.enabled=false
