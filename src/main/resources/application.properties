spring.application.name=starscreen-ticketing
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/starscreen?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
# 数据库密码：通过环境变量 DB_PASSWORD 注入，默认值仅用于本地开发，勿填真实密码
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

logging.level.root=WARN
logging.level.com.starscreen=INFO