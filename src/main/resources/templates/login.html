<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 / 注册 - 星幕影票</title>
    <link rel="stylesheet" href="/css/login-modal.css">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", Arial, sans-serif;
           background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
           min-height: 100vh; display: flex; justify-content: center;
           align-items: center; color: #333; }

    /* 视觉隐藏标签，用于解决 SonarQube 的无障碍标签警告，不影响 UI */
    .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0;
        margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0);
        white-space: nowrap; border-width: 0;
    }

    .login-box { background: #fff; border-radius: 12px; padding: 40px 44px;
                 width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-title { font-size: 26px; font-weight: bold; color: #1e3a8a;
                   text-align: center; margin-bottom: 8px; }
    .login-sub { text-align: center; color: #999; font-size: 13px;
                 margin-bottom: 28px; }

    .tabs { display: flex; border-bottom: 1px solid #e5e5e5; margin-bottom: 24px; }
    .tab { flex: 1; padding: 12px 0; text-align: center; font-size: 14px;
           color: #999; cursor: pointer; border-bottom: 2px solid transparent;
           transition: all 0.2s; }
    .tab.active { color: #1e3a8a; font-weight: bold; border-bottom-color: #1e3a8a; }

    .panel { display: none; }
    .panel.active { display: block; }

    .row { margin-bottom: 16px; }
    .row input { width: 100%; height: 46px; border: 1px solid #e5e5e5;
                 border-radius: 6px; padding: 0 15px; font-size: 14px;
                 outline: none; transition: border-color 0.2s; }
    .row input:focus { border-color: #1e3a8a; }

    .input-group { display: flex; align-items: center;
                   border: 1px solid #e5e5e5; border-radius: 6px;
                   overflow: hidden; }
    .input-group:focus-within { border-color: #1e3a8a; }
    .input-group .prefix { padding: 0 14px; height: 46px; display: flex;
                           align-items: center; background: #fafafa;
                           color: #666; border-right: 1px solid #e5e5e5; }
    .input-group input { flex: 1; border: none; border-radius: 0; height: 46px; }
    .input-group input:focus { border: none; }
    .input-group button { height: 46px; padding: 0 18px; border: none;
                          background: #fff; color: #1e3a8a; font-size: 13px;
                          cursor: pointer; border-left: 1px solid #e5e5e5;
                          white-space: nowrap; }
    .input-group button:disabled { color: #ccc; cursor: not-allowed; }

    .btn { width: 100%; height: 46px; background: #1e3a8a; color: #fff;
           border: none; border-radius: 6px; font-size: 16px;
           font-weight: bold; cursor: pointer; margin-top: 8px; }
    .btn:hover:not(:disabled) { background: #152c6b; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .msg { display: none; padding: 9px 14px; border-radius: 6px;
           font-size: 13px; margin-bottom: 16px; }
    .msg.error { background: #fef0f0; color: #e74c3c; display: block; }
    .msg.success { background: #f0fff4; color: #43a047; display: block; }

    .back-home { display: block; text-align: center; margin-top: 20px;
                 color: #999; font-size: 13px; text-decoration: none; }
    .back-home:hover { color: #1e3a8a; }
    </style>
</head>
<body>

<div class="login-box">
    <div class="login-title">星幕影票</div>
    <div class="login-sub">让每一次观影都值得</div>

    <div class="tabs">
        <div class="tab active" id="tabSms">手机号验证码</div>
        <div class="tab" id="tabPwd">账号密码</div>
    </div>

    <div class="msg" id="msgBox"></div>

    <!-- 短信登录 -->
    <div class="panel active" id="panelSms">
        <div class="row">
            <div class="input-group">
                <div class="prefix">+86</div>
                <!-- 【修复】补充视觉隐藏的 label -->
                <label for="smsPhone" class="sr-only">手机号</label>
                <input type="tel" id="smsPhone" placeholder="请输入手机号" maxlength="11">
            </div>
        </div>
        <div class="row">
            <div class="input-group">
                <label for="smsCode" class="sr-only">短信验证码</label>
                <input type="text" id="smsCode" placeholder="请输入短信验证码" maxlength="6">
                <button type="button" id="sendCodeBtn">发送验证码</button>
            </div>
        </div>
        <button class="btn" id="smsLoginBtn" disabled>登录 / 注册</button>
    </div>

    <!-- 账号密码 -->
    <div class="panel" id="panelPwd">
        <div class="row">
            <label for="pwdUsername" class="sr-only">用户名</label>
            <input type="text" id="pwdUsername" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="row">
            <label for="pwdPassword" class="sr-only">密码</label>
            <input type="password" id="pwdPassword" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn" id="pwdLoginBtn" disabled>登录</button>
    </div>

    <a href="/" class="back-home">← 返回首页</a>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const tabSms = document.getElementById('tabSms');
    const tabPwd = document.getElementById('tabPwd');
    const panelSms = document.getElementById('panelSms');
    const panelPwd = document.getElementById('panelPwd');
    const msgBox = document.getElementById('msgBox');

    const smsPhone = document.getElementById('smsPhone');
    const smsCode = document.getElementById('smsCode');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const smsLoginBtn = document.getElementById('smsLoginBtn');

    const pwdUsername = document.getElementById('pwdUsername');
    const pwdPassword = document.getElementById('pwdPassword');
    const pwdLoginBtn = document.getElementById('pwdLoginBtn');

    let countdown = 0;
    let timer = null;

    function showMsg(text, type) {
        msgBox.textContent = text;
        msgBox.className = 'msg ' + type;
    }
    function hideMsg() { msgBox.className = 'msg'; }

    tabSms.addEventListener('click', function () {
        tabSms.classList.add('active'); tabPwd.classList.remove('active');
        panelSms.classList.add('active'); panelPwd.classList.remove('active');
        hideMsg();
    });
    tabPwd.addEventListener('click', function () {
        tabPwd.classList.add('active'); tabSms.classList.remove('active');
        panelPwd.classList.add('active'); panelSms.classList.remove('active');
        hideMsg();
    });

    // ===== 手机验证码 =====
    function checkSendBtn() {
        const phone = smsPhone.value.trim();
        const valid = /^1[3-9]\d{9}$/.test(phone);
        sendCodeBtn.disabled = !(valid && countdown === 0);
        sendCodeBtn.textContent = countdown > 0 ? (countdown + ' 秒后重发') : '发送验证码';
    }
    function checkSmsLoginBtn() {
        const vp = /^1[3-9]\d{9}$/.test(smsPhone.value.trim());
        const vc = /^\d{6}$/.test(smsCode.value.trim());
        smsLoginBtn.disabled = !(vp && vc);
    }
    smsPhone.addEventListener('input', function () { checkSendBtn(); checkSmsLoginBtn(); });
    smsCode.addEventListener('input', checkSmsLoginBtn);
    checkSendBtn();
    checkSmsLoginBtn();

    sendCodeBtn.addEventListener('click', function () {
        const phone = smsPhone.value.trim();
        if (!/^1[3-9]\d{9}$/.test(phone)) { showMsg('请输入正确的手机号', 'error'); return; }
        sendCodeBtn.disabled = true;

        fetch('/api/user/send-sms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code !== 200) throw new Error(result.message);
            const code = result.data;
            alert('【演示环境】\n您的验证码是：' + code + '\n\n已自动填入。');
            smsCode.value = code;
            checkSmsLoginBtn();

            countdown = 60;
            checkSendBtn();
            timer = setInterval(function () {
                countdown--;
                checkSendBtn();
                if (countdown <= 0) { clearInterval(timer); checkSendBtn(); }
            }, 1000);
        })
        .catch(err => {
            showMsg(err.message || '发送失败', 'error');
            sendCodeBtn.disabled = false;
            checkSendBtn();
        });
    });

    smsLoginBtn.addEventListener('click', function () {
        const phone = smsPhone.value.trim();
        const code = smsCode.value.trim();
        if (!/^1[3-9]\d{9}$/.test(phone)) { showMsg('请输入正确的手机号', 'error'); return; }
        if (!/^\d{6}$/.test(code)) { showMsg('请输入 6 位验证码', 'error'); return; }

        smsLoginBtn.disabled = true;
        smsLoginBtn.textContent = '登录中...';

        fetch('/api/user/login-sms', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: phone, code: code })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code !== 200) throw new Error(result.message);
            showMsg('登录成功，跳转中...', 'success');
            setTimeout(function () {
                const back = sessionStorage.getItem('loginBack') || '/';
                sessionStorage.removeItem('loginBack');
                window.location.href = back;
            }, 700);
        })
        .catch(err => {
            showMsg(err.message || '登录失败', 'error');
            smsLoginBtn.disabled = false;
            smsLoginBtn.textContent = '登录 / 注册';
            checkSmsLoginBtn();
        });
    });

    // ===== 账号密码 =====
    function checkPwdLoginBtn() {
        const u = pwdUsername.value.trim();
        const p = pwdPassword.value.trim();
        pwdLoginBtn.disabled = !(u && p);
    }
    pwdUsername.addEventListener('input', checkPwdLoginBtn);
    pwdPassword.addEventListener('input', checkPwdLoginBtn);
    checkPwdLoginBtn();

    pwdLoginBtn.addEventListener('click', function () {
        const username = pwdUsername.value.trim();
        const password = pwdPassword.value.trim();
        if (!username || !password) { showMsg('请填写用户名和密码', 'error'); return; }

        pwdLoginBtn.disabled = true;
        pwdLoginBtn.textContent = '登录中...';

        fetch('/api/user/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username, password: password })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code !== 200) throw new Error(result.message);
            showMsg('登录成功，跳转中...', 'success');
            setTimeout(function () {
                const back = sessionStorage.getItem('loginBack') || '/';
                sessionStorage.removeItem('loginBack');
                window.location.href = back;
            }, 700);
        })
        .catch(err => {
            showMsg(err.message || '登录失败', 'error');
            pwdLoginBtn.disabled = false;
            pwdLoginBtn.textContent = '登录';
            checkPwdLoginBtn();
        });
    });
});
</script>

</body>
</html>
